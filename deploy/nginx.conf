# admin-front：gz 上 80 端口的默认站点（按 IP 访问），静态文件 + /api 反向代理到后端。
# 部署脚本会复制到 /etc/nginx/sites-available/admin-front 并替换原来的 default 站点链接。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/admin-front/current;
    index index.html;

    # 构建时已生成 .gz，优先直接发送；没有 .gz 的文件再实时压缩
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 带哈希的构建产物（js、css、jse 目录和 _app-config-*.js）长期缓存
    location ~ ^/(js|css|jse)/|^/_app-config- {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # 前端路由（history 模式）回退到 index.html；index.html 不缓存，发布后立即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
